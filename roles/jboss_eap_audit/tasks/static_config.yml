---
- name: Inspect required JBoss EAP files
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - name: version
      path: "{{ jboss_version_file }}"
    - name: host_xml
      path: "{{ jboss_host_config }}"
    - name: domain_xml
      path: "{{ jboss_domain_config }}"
    - name: init_config
      path: "{{ jboss_init_config }}"
    - name: keystore
      path: "{{ jboss_keystore_path }}"
  register: jboss_file_stats

- name: Create a file status lookup
  ansible.builtin.set_fact:
    jboss_files: >-
      {{
        jboss_files | default({})
        | combine({item.item.name: item.stat})
      }}
  loop: "{{ jboss_file_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Read the JBoss EAP version file
  ansible.builtin.slurp:
    src: "{{ jboss_version_file }}"
  when: jboss_files.version.exists
  register: jboss_version_raw

- name: Read the legacy init configuration
  ansible.builtin.slurp:
    src: "{{ jboss_init_config }}"
  when: jboss_files.init_config.exists
  register: jboss_init_config_raw
  no_log: true

- name: Extract non-commented JAVA_HOME, JBOSS_USER, and JBOSS_MODE settings
  ansible.builtin.set_fact:
    jboss_init_settings: >-
      {{
        (jboss_init_config_raw.content | b64decode)
        | regex_findall('(?m)^(?:JAVA_HOME|JBOSS_USER|JBOSS_MODE)=.*$')
      }}
  when: jboss_files.init_config.exists

- name: Default legacy init settings when the file does not exist
  ansible.builtin.set_fact:
    jboss_init_settings: []
  when: not jboss_files.init_config.exists

- name: Read host.xml
  ansible.builtin.slurp:
    src: "{{ jboss_host_config }}"
  when: jboss_files.host_xml.exists
  register: jboss_host_xml_raw
  no_log: true

- name: Read domain.xml
  ansible.builtin.slurp:
    src: "{{ jboss_domain_config }}"
  when: jboss_files.domain_xml.exists
  register: jboss_domain_xml_raw
  no_log: true

- name: Query the host name from host.xml
  community.general.xml:
    xmlstring: "{{ jboss_host_xml_raw.content | b64decode }}"
    xpath: "/*[local-name()='host']"
    content: attribute
  delegate_to: localhost
  become: false
  when: jboss_files.host_xml.exists
  register: jboss_host_root
  changed_when: false
  no_log: true

- name: Query bind-address settings from host.xml
  community.general.xml:
    xmlstring: "{{ jboss_host_xml_raw.content | b64decode }}"
    xpath: >-
      //*[local-name()='interfaces']
      /*[local-name()='interface']
      /*[local-name()='inet-address'
      and contains(@value, 'jboss.bind.address')]
    content: attribute
  delegate_to: localhost
  become: false
  when: jboss_files.host_xml.exists
  register: jboss_bind_properties
  changed_when: false
  failed_when: false
  no_log: true

- name: Count configured servers in host.xml
  community.general.xml:
    xmlstring: "{{ jboss_host_xml_raw.content | b64decode }}"
    # community.general.xml evaluates this against the document node.
    xpath: "*[local-name()='host']/*[local-name()='servers']/*[local-name()='server']"
    count: true
  delegate_to: localhost
  become: false
  when: jboss_files.host_xml.exists
  register: jboss_host_server_count
  changed_when: false
  no_log: true

- name: Query configured servers from host.xml
  community.general.xml:
    xmlstring: "{{ jboss_host_xml_raw.content | b64decode }}"
    xpath: "/*[local-name()='host']/*[local-name()='servers']/*[local-name()='server']"
    content: attribute
  delegate_to: localhost
  become: false
  when:
    - jboss_files.host_xml.exists
    - jboss_host_server_count.count | default(0) | int > 0
  register: jboss_host_servers
  changed_when: false
  no_log: true

- name: Build the configured server name list
  ansible.builtin.set_fact:
    jboss_server_names: >-
      {{
        (jboss_host_servers | default({})).matches
        | default([])
        | map('dict2items')
        | map('first')
        | map(attribute='value')
        | map(attribute='name')
        | list
      }}

- name: Collect selected domain.xml settings in one pass
  ansible.builtin.set_fact:
    jboss_domain_audit: >-
      {{ (jboss_domain_xml_raw.content | b64decode) | jboss_eap_domain_audit }}
  when: jboss_files.domain_xml.exists
  no_log: true

- name: Map host, group, and server JVM settings from XML
  ansible.builtin.set_fact:
    jboss_jvm_config_audit: >-
      {{
        (jboss_host_xml_raw.content | b64decode)
        | jboss_eap_jvm_config(
            (jboss_domain_xml_raw.content | b64decode)
            if jboss_files.domain_xml.exists else ''
          )
      }}
  when: jboss_files.host_xml.exists
  no_log: true

- name: Inspect the configured keystore without exposing its password
  ansible.builtin.command:
    argv:
      - "{{ jboss_keytool_path }}"
      - -list
      - -v
      - -keystore
      - "{{ jboss_keystore_path }}"
    stdin: "{{ jboss_keystore_password }}"
    stdin_add_newline: true
  environment:
    LC_ALL: C
  when:
    - jboss_files.keystore.exists
    - jboss_keystore_password | length > 0
  register: jboss_keytool
  changed_when: false
  failed_when: false
  no_log: true

- name: Keep only certificate validity lines in the audit result
  ansible.builtin.set_fact:
    jboss_keystore_validity: >-
      {{
        jboss_keytool.stdout_lines
        | default([])
        | select('match', '^Valid from:')
        | list
      }}
  when:
    - jboss_keytool is defined
    - not (jboss_keytool.skipped | default(false))
